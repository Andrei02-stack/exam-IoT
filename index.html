t-weight:750}.options{display:grid;gap:10px}.opt{width:100%;text-align:left;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;line-height:1.35}.opt:hover{border-color:#38bdf8}.opt.correct{border-color:var(--good);background:rgba(34,197,94,.13)}.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.14)}.opt.disabled{cursor:default}.feedback{margin-top:13px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#0b1220;display:none}.feedback.show{display:block}.feedback.good{border-color:rgba(34,197,94,.45)}.feedback.bad{border-color:rgba(239,68,68,.45)}.source{font-size:12px;color:var(--muted);margin-top:8px}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px 0 0}.empty{text-align:center;color:var(--muted);padding:40px}.small{font-size:12px;color:var(--muted);line-height:1.45}.modebox{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hidden{display:none!important}

  <div class="wrap">
    <div class="hero">
      <div class="title"><h1>Grile interactive IoT</h1><p>Aplicație offline pentru recapitulare rapidă. Alege cursul, răspunde, vezi explicația și repetă întrebările greșite.</p></div>
      <div class="badge" id="totalBadge"></div>

      <button class="btn" id="shuffleBtn">Amestecă</button>

      <aside class="panel side">

        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="small" id="summary"></div>
        <div class="modebox"><button class="btn secondary" id="resetBtn">Resetează progres</button><button class="btn secondary" id="showAnswersBtn">Arată răspunsurile</button></div>
        <div class="small"><b>Cursuri incluse:</b></div><div class="course-list" id="courseChips"></div>
      </aside>
      <main class="panel main"><div id="questions"></div><div class="footer-actions"><button class="btn" id="nextWrongBtn">Repetă greșitele</button><button class="btn secondary" onclick="window.print()">Printează / salvează PDF</button></div></main>

ispus la pierderi", "Are mereu latență zero", "Nu consumă niciodată energie", "Nu poate fi interferat"], "answer": 0, "explanation": "WSN funcționează pe medii wireless cu bandwidth redus și fiabilitate limitată.", "source": "IoT-SRIC-2026-WSN, Characteristics"}, {"course": "Curs 2 - WSN", "q": "Ce aplicație este potrivită pentru WSN?", "options": ["Monitorizarea temperaturii, umidității sau presiunii", "Compilarea unui sistem de operare desktop", "Editarea unui film 4K local", "Rularea unui joc AAA pe GPU"], "answer": 0, "explanation": "WSN sunt folosite pentru monitorizare de parametri de mediu și colectare de date distribuite.", "source": "IoT-SRIC-2026-WSN"}, {"course": "Curs 2 - WSN", "q": "De ce nodurile WSN sunt adesea battery-operated?", "options": ["Pentru că sunt amplasate distribuit, uneori greu accesibil, și trebuie să consume puțină energie", "Pentru că au nevoie permanent de cablu Ethernet", "Pentru că nu comunică wireless", "Pentru că nu au senzori"], "answer": 0, "explanation": "Caracteristicile WSN includ low power și battery operation, important pentru rețele distribuite.", "source": "IoT-SRIC-2026-WSN"}, {"course": "Curs 3 - Protocoale", "q": "Care sunt layerele principale prezentate în stiva de rețea IoT?", "options": ["Physical, Data Link, Network, Transport, Application", "Only Application și UI", "Presentation, Rendering, Animation", "Storage, Database, Cache"], "answer": 0, "explanation": "Stiva IoT include niveluri de la fizic/data link până la transport și aplicație.", "source": "IoT-SRIC-2026-Protocols, IoT Network Stack"}, {"course": "Curs 3 - Protocoale", "q": "Care tehnologie este asociată cu IEEE 802.15.4?", "options": ["Low Data Rate WPAN pentru rețele IoT low-power", "Wi-Fi de mare viteză 802.11ax obligatoriu", "Doar comunicație prin fibră optică", "Exclusiv stocare cloud"], "answer": 0, "explanation": "Cursul menționează IEEE 802.15.4 ca standard pentru low-power IoT networks și low data-rate WPAN.", "source": "IoT-SRIC-2026-Protocols, IEEE 802.15.4"}, {"course": "Curs 3 - Protocoale", "q": "Pe ce se bazează ZigBee, Thread și WirelessHART?", "options": ["IEEE 802.15.4", "HTTP/2 exclusiv", "SQL", "NFC obligatoriu"], "answer": 0, "explanation": "IEEE 802.15.4 este baza pentru ZigBee, Thread și WirelessHART.", "source": "IoT-SRIC-2026-Protocols"}, {"course": "Curs 3 - Protocoale", "q": "Care este dimensiunea maximă a unui frame IEEE 802.15.4 menționată în curs?", "options": ["127 bytes", "1500 bytes", "64 KB", "1 MB"], "answer": 0, "explanation": "Slide-ul menționează frame size de 127 bytes, cu payload aproximativ 102 bytes.", "source": "IoT-SRIC-2026-Protocols, IEEE 802.15.4"}, {"course": "Curs 3 - Protocoale", "q": "Care este data rate-ul maxim menționat pentru IEEE 802.15.4?", "options": ["Până la 250 Kbps", "Până la 10 Gbps", "Până la 1 Tbps", "Exact 56 Kbps"], "answer": 0, "explanation": "Cursul menționează data rate up to 250Kbps pentru IEEE 802.15.4.", "source": "IoT-SRIC-2026-Protocols"}, {"course": "Curs 3 - Protocoale", "q": "Ce tipuri de adrese MAC sunt menționate pentru IEEE 802.15.4?", "options": ["64-bit sau 16-bit MAC addresses", "Doar 8-bit", "Doar IPv4", "Nu are adrese"], "answer": 0, "explanation": "IEEE 802.15.4 poate folosi adrese MAC de 64 biți sau 16 biți.", "source": "IoT-SRIC-2026-Protocols"}, {"course": "Curs 3 - Protocoale", "q": "Care dintre următoarele apar la nivel Physical/Data Link în IoT?", "options": ["Wi-Fi, BLE, RFID, IEEE 802.15.4", "TCP și UDP exclusiv", "CoAP și MQTT exclusiv", "TLS și DTLS exclusiv"], "answer": 0, "explanation": "Slide-ul Physical/Data Link enumeră 802.11 Wi-Fi, 802.15.1 BLE, RFID și 802.15.4.", "source": "IoT-SRIC-2026-Protocols"}, {"course": "Curs 3 - Protocoale", "q": "De ce este importantă stiva IoT?", "options": ["Organizează comunicația de la link fizic până la aplicații precum CoAP/MQTT", "Înlocuiește orice sistem de securitate", "Elimină nevoia de senzori", "Face doar randare grafică"], "answer": 0, "explanation": "Stiva clarifică u r": 0, "explanation": "IPv6 oferă adrese de 128 de biți, ceea ce permite spațiu mare de adresare pentru multe noduri.", "source": "IoT-SRIC-2026-6LoWPAN, IPv6 Addressing"}, {"course": "Curs 4 - IPv6 & 6LoWPAN", "q": "Ce regulă de scurtare IPv6 permite folosirea simbolului ::?", "options": ["Zero Compression, pentru grupuri consecutive de zerouri, o singură dată în adresă", "Omiterea tuturor grupurilor fără restricții", "Fragmentarea 6LoWPAN", "Criptarea cu DTLS"], "answer": 0, "explanation": "Zero Compression permite omiterea grupurilor consecutive de zero prin ::, dar numai o dată într-o adresă.", "source": "IoT-SRIC-2026-6LoWPAN, IPv6 - Shorter Address"}, {"course": "Curs 4 - IPv6 & 6LoWPAN", "q": "Ce reprezintă prefixul într-o adresă IPv6, conform slide-ului?", "options": ["Numărul de biți 1 din subnet mask", "Numărul de porturi TCP deschise", "Dimensiunea payload-ului CoAP", "Numărul de senzori din rețea"], "answer": 0, "explanation": "Slide-ul IPv6 Addressing definește prefixul ca numărul de 1s din subnet mask.", "source": "IoT-SRIC-2026-6LoWPAN, IPv6 Addressing"}, {"course": "Curs 5 - CoAP & MQTT", "q": "Cu ce grup IETF este asociat CoAP în curs?", "options": ["IETF CORE WG / RFC 7252", "IEEE 802.11 WG", "Bluetooth SIG exclusiv", "Gartner Hype Cycle"], "answer": 0, "explanation": "Slide-ul CoAP: The Web of Things Protocol menționează IETF CORE WG și RFC 7252.", "source": "IoT-SRIC-2026-CoAP&MQTT, CoAP"}, {"course": "Curs 5 - CoAP & MQTT", "q": "Ce metode similare HTTP sunt folosite în CoAP?", "options": ["GET, POST, PUT, DELETE", "SELECT, INSERT, UPDATE, DELETE", "PUBLISH, SUBSCRIBE, UNSUBSCRIBE", "SYN, ACK, FIN"], "answer": 0, "explanation": "CoAP are semantică asemănătoare HTTP și folosește metode precum GET, POST, PUT și DELETE.", "source": "IoT-SRIC-2026-CoAP&MQTT, CoAP"}, {"course": "Curs 5 - CoAP & MQTT", "q": "De ce folosește CoAP UDP?", "options": ["Pentru a reduce overhead-ul de comunicație și consumul de resurse", "Pentru a garanta mereu ordinea perf lanation": "Slide-ul Typical IoT constraints include secure boot, signed updates, testability, observability și fast bring-up.", "source": "IoT-SRIC-2026-Zephyr, Typical IoT constraints"}, {"course": "Curs Zephyr RTOS", "q": "Ce modele de scheduling sunt importante pe MCUs în RTOS?", "options": ["Priority-based scheduling, preemptive/cooperative threads și time slicing opțional", "Doar first-come-first-served fără priorități", "Doar batch processing zilnic", "Doar scheduling cloud"], "answer": 0, "explanation": "Slide-ul Kernel & RTOS design patterns menționează scheduling bazat pe priorități, fire preemptive/cooperative și time slicing opțional.", "source": "IoT-SRIC-2026-Zephyr, Kernel & RTOS design patterns"}];
const key = 'iot_sric_quiz_progress_v1';
let state = JSON.parse(localStorage.getItem(key)||'{}');
const optionKey = key + '_optionOrders';
let optionOrders = loadOptionOrders();
let order = QUESTIONS.map((_,i)=>i);
let forceAnswers = false;
const $=s=>document.querySelector(s);
const save=()=>{localStorage.setItem(key,JSON.stringify(state)); localStorage.setItem(optionKey,JSON.stringify(optionOrders));};
function shuffleArray(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function makeOptionOrders(){return QUESTIONS.map(q=>shuffleArray(q.options.map((_,idx)=>idx)));}
function loadOptionOrders(){
  try{
    const saved=JSON.parse(localStorage.getItem(optionKey)||'null');
    if(Array.isArray(saved) && saved.length===QUESTIONS.length && saved.every((o,i)=>Array.isArray(o)&&o.length===QUESTIONS[i].options.length)) return saved;
  }catch(e){}
  const fresh = QUESTIONS.map(q=>{
    const arr=q.options.map((_,idx)=>idx);
    for(let i=arr.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]];}
    return arr;
  });
  localStorage.setItem(optionKey,JSON.stringify(fresh));
  return fresh;
}
function resetProgressAndAnswers(){
  state={};
  optionOrders=makeOptionOrders();
  save();
  render();
}
function courses(){return [...new Set(QUESTIONS.map(q=>q.course))];}
function init(){
  $('#totalBadge').textContent = QUESTIONS.length + ' întrebări';
  $('#courseFilter').innerHTML = '<option value="all">Toate cursurile</option>' + courses().map(c=>`<option>${c}</option>`).join('');
  $('#courseChips').innerHTML = courses().map(c=>`<span class="chip">${c}</span>`).join('');
  ['search','courseFilter','mode'].forEach(id=>$('#'+id).addEventListener('input',render));
  $('#shuffleBtn').onclick=()=>{order.sort(()=>Math.random()-.5);render();};
  $('#resetBtn').onclick=()=>{if(confirm('Sigur resetezi progresul? Se vor amesteca și pozițiile răspunsurilor corecte.')) resetProgressAndAnswers();};
  $('#showAnswersBtn').onclick=()=>{forceAnswers=!forceAnswers;$('#showAnswersBtn').textContent=forceAnswers?'Ascunde răspunsurile':'Arată răspunsurile';render();};
  $('#nextWrongBtn').onclick=()=>{$('#mode').value='wrong';render();window.scrollTo({top:0,behavior:'smooth'});};
  render();
}
function filtered(){
  const s=$('#search').value.trim().toLowerCase(), c=$('#courseFilter').value, m=$('#mode').value;
  return order.filter(i=>{const q=QUESTIONS[i], st=state[i];
    if(c!='all' && q.course!==c) return false;
    if(s && !(q.q+' '+q.options.join(' ')+' '+q.explanation+' '+q.course).toLowerCase().includes(s)) return false;
    if(m==='unanswered' && st) return false;
    if(m==='wrong' && (!st || st.correct)) return false;
    return true;
  });
}
function renderStats(){
  const vals=Object.values(state); const answered=vals.length; const correct=vals.filter(x=>x.correct).length;
  $('#score').textContent=correct; $('#answered').textContent=answered;
  $('#bar').style.width=(QUESTIONS.length?answered/QUESTIONS.length*100:0)+'%';
  const pct=answered?Math.round(correct/answered*100):0;
  $('#summary').innerHTML=`Scor curent: <b>${pct}%</b><br>${answered}/${QUESTIONS.length} rezolvate. ${vals.filter(x=>!x.correct).length} greșite de repetat.`;
}
function render(){
  renderStats();
  const list=filtered(), root=$('#questions');
  if(!list.length){root.innerHTML='<div class="empty">Nu există întrebări pentru filtrul ales.</div>';return;}
  root.innerHTML=list.map((i,pos)=>card(i,pos)).join('');
  list.forEach(i=>{(optionOrders[i]||QUESTIONS[i].options.map((_,idx)=>idx)).forEach((originalIndex,displayIndex)=>{
    document.getElementById(`q${i}o${displayIndex}`)?.addEventListener('click',()=>answer(i,originalIndex));
  });});
}
function card(i,pos){
  const q=QUESTIONS[i], st=state[i], reveal=forceAnswers||st; const selected=st?.selected;
  const displayOrder = optionOrders[i] || q.options.map((_,idx)=>idx);
  const opts=displayOrder.map((originalIndex,displayIndex)=>{
    const o=q.options[originalIndex];
    let cls='opt';
    if(reveal){cls+=' disabled'; if(originalIndex===q.answer) cls+=' correct'; if(selected===originalIndex && selected!==q.answer) cls+=' wrong';}
    return `<button class="${cls}" id="q${i}o${displayIndex}" ${reveal?'disabled':''}><b>${String.fromCharCode(65+displayIndex)}.</b> ${escapeHtml(o)}</button>`
  }).join('');
  const fbClass = reveal ? (selected===q.answer || forceAnswers ? 'show good':'show bad') : '';
  const verdict = !reveal ? '' : (selected===q.answer ? 'Corect.' : forceAnswers && !st ? 'Răspuns afișat.' : 'Greșit.');
  return `<section class="question-card"><div class="qtop"><span class="tag">${escapeHtml(q.course)}</span><span class="qnum">#${i+1}</span></div><div class="question">${escapeHtml(q.q)}</div><div class="options">${opts}</div><div class="feedback ${fbClass}"><b>${verdict}</b> ${escapeHtml(q.explanation)}<div class="source">Sursă: ${escapeHtml(q.source)}</div></div></section>`;
}
function answer(i,oi){
  state[i]={selected:oi,correct:oi===QUESTIONS[i].answer,t:Date.now()}; save(); render();
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
init();
</script>
