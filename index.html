<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Grile interactive IoT SRIC</title>
  <style>
    :root{--bg:#0f172a;--card:#111827;--muted:#94a3b8;--text:#e5e7eb;--accent:#14b8a6;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--line:#243244;--chip:#1f2937}
    *{box-sizing:border-box} body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:radial-gradient(circle at top left,#164e63 0,#0f172a 34%,#020617 100%);color:var(--text);min-height:100vh}
    .wrap{max-width:1120px;margin:0 auto;padding:26px 16px 60px}.hero{display:flex;gap:18px;align-items:flex-start;justify-content:space-between;margin-bottom:18px}.title h1{font-size:clamp(28px,4vw,46px);margin:0 0 8px}.title p{margin:0;color:var(--muted);line-height:1.5}.badge{background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.35);color:#99f6e4;border-radius:999px;padding:8px 12px;white-space:nowrap;margin-top:6px}
    .panel{background:rgba(17,24,39,.82);backdrop-filter:blur(10px);border:1px solid rgba(148,163,184,.18);border-radius:22px;box-shadow:0 18px 50px rgba(0,0,0,.35)}.controls{padding:16px;display:grid;grid-template-columns:1.3fr 1fr 1fr auto;gap:10px;margin-bottom:16px}.controls input,.controls select{width:100%;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:12px 13px;font-size:14px}.btn{border:0;border-radius:14px;padding:12px 14px;font-weight:700;cursor:pointer;background:var(--accent);color:#042f2e;transition:.15s}.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}.btn.secondary{background:#1f2937;color:#e5e7eb;border:1px solid var(--line)}.btn.danger{background:#7f1d1d;color:#fee2e2}.grid{display:grid;grid-template-columns:300px 1fr;gap:16px}.side{padding:16px;height:max-content;position:sticky;top:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.stat{background:#0b1220;border:1px solid var(--line);border-radius:16px;padding:12px}.stat .num{font-size:26px;font-weight:800}.stat .lab{font-size:12px;color:var(--muted)}.progress{height:10px;background:#0b1220;border-radius:999px;overflow:hidden;border:1px solid var(--line);margin:12px 0}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--accent),#38bdf8);transition:.25s}.course-list{display:flex;flex-wrap:wrap;gap:8px}.chip{font-size:12px;background:var(--chip);border:1px solid var(--line);color:#cbd5e1;padding:7px 9px;border-radius:999px}.main{padding:16px}.question-card{padding:18px;margin-bottom:14px;background:rgba(15,23,42,.75);border:1px solid var(--line);border-radius:20px}.qtop{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:12px}.tag{font-size:12px;color:#a7f3d0;background:rgba(20,184,166,.12);border:1px solid rgba(20,184,166,.25);border-radius:999px;padding:6px 9px}.qnum{color:var(--muted);font-size:13px}.question{font-size:19px;line-height:1.45;margin:10px 0 14px;font-weight:750}.options{display:grid;gap:10px}.opt{width:100%;text-align:left;background:#0b1220;color:var(--text);border:1px solid var(--line);border-radius:16px;padding:13px 14px;cursor:pointer;line-height:1.35}.opt:hover{border-color:#38bdf8}.opt.correct{border-color:var(--good);background:rgba(34,197,94,.13)}.opt.wrong{border-color:var(--bad);background:rgba(239,68,68,.14)}.opt.disabled{cursor:default}.feedback{margin-top:13px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#0b1220;display:none}.feedback.show{display:block}.feedback.good{border-color:rgba(34,197,94,.45)}.feedback.bad{border-color:rgba(239,68,68,.45)}.source{font-size:12px;color:var(--muted);margin-top:8px}.footer-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;padding:12px 0 0}.empty{text-align:center;color:var(--muted);padding:40px}.small{font-size:12px;color:var(--muted);line-height:1.45}.modebox{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.hidden{display:none!important}
    @media(max-width:850px){.hero{flex-direction:column}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.side{position:static}.question{font-size:17px}.badge{white-space:normal}}
    @media print{body{background:white;color:#111}.panel,.question-card{box-shadow:none;border:1px solid #ddd;background:white;color:#111}.controls,.side,.footer-actions{display:none}.grid{display:block}.opt{color:#111;background:white}.feedback{display:block;color:#111}.tag{color:#111}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="title"><h1>Grile interactive IoT</h1></div>
      <div class="badge" id="totalBadge"></div>
    </div>
    <div class="panel controls">
      <input id="search" placeholder="Caută: CoAP, IPv6, jamming, TinyML..." />
      <select id="courseFilter"></select>
      <select id="mode"><option value="all">Toate întrebările</option><option value="unanswered">Nerezolvate</option><option value="wrong">Doar greșite</option></select>
      <button class="btn" id="shuffleBtn">Amestecă</button>
    </div>
    <div class="grid">
      <aside class="panel side">
        <div class="stats"><div class="stat"><div class="num" id="score">0</div><div class="lab">corecte</div></div><div class="stat"><div class="num" id="answered">0</div><div class="lab">rezolvate</div></div></div>
        <div class="progress"><div class="bar" id="bar"></div></div>
        <div class="small" id="summary"></div>
        <div class="modebox"><button class="btn secondary" id="resetBtn">Resetează progres</button><button class="btn secondary" id="showAnswersBtn">Arată răspunsurile</button></div>
        <div class="small"><b>Cursuri incluse:</b></div><div class="course-list" id="courseChips"></div>
      </aside>
      <main class="panel main"><div id="questions"></div><div class="footer-actions"><button class="btn" id="nextWrongBtn">Repetă greșitele</button><button class="btn secondary" onclick="window.print()">Printează / salvează PDF</button></div></main>
    </div>
  </div>
<script>
const QUESTIONS = [{"course":"Curs 1 - Introduction","q":"Care afirmație descrie cel mai corect un sistem IoT, nu doar un dispozitiv conectat?","options":["Integrează obiecte fizice adresabile, senzori/actuatori, conectivitate și procesare a datelor pentru monitorizare sau control.","Este orice echipament cu adresă IP, indiferent dacă observă sau acționează asupra mediului fizic.","Este o aplicație cloud care colectează date, chiar dacă sursele nu sunt dispozitive fizice.","Este o rețea locală de calculatoare în care toate nodurile rulează același sistem de operare."],"answer":0,"explanation":"IoT nu înseamnă doar „are Internet”, ci legătura dintre obiecte fizice, date, conectivitate și eventual acțiune asupra mediului.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 1 - Introduction","q":"De ce IPv6 apare recurent în cursurile IoT?","options":["Pentru că spațiul mare de adresare permite rețele cu foarte multe noduri adresabile, inclusiv dispozitive constrained.","Pentru că IPv6 reduce automat consumul radio al tuturor nodurilor față de orice variantă IPv4.","Pentru că IPv6 înlocuiește nivelul de transport și elimină alegerea dintre UDP și TCP.","Pentru că IPv6 oferă securitate end-to-end implicită pentru orice protocol de aplicație."],"answer":0,"explanation":"Motivul central este adresarea pe 128 de biți și scalarea rețelelor mari; securitatea și energia depind de alte mecanisme.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 1 - Introduction","q":"Într-o arhitectură IoT, care separare de roluri este cea mai corectă?","options":["Senzorul măsoară mediul, actuatorul modifică mediul, gateway-ul intermediază comunicația cu alte rețele sau cloud-ul.","Senzorul execută comenzi fizice, actuatorul colectează date, gateway-ul rulează exclusiv modele ML.","Gateway-ul este obligatoriu senzorul principal, iar actuatorul este doar o adresă IPv6.","Senzorii și actuatorii sunt echivalenți; diferența apare doar la nivel de protocol IP."],"answer":0,"explanation":"Senzorii observă, actuatorii acționează, iar gateway-ul/base station/sink agregă și face legătura cu infrastructura externă.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 1 - Introduction","q":"Care este o interpretare corectă a ideii că IoT implică „real-time guarantee”?","options":["Sistemul trebuie proiectat cu bugete de latență potrivite aplicației, nu doar cu transmitere eventuală a datelor.","Toate mesajele IoT trebuie să ajungă sub 1 ms, indiferent de protocol și mediu radio.","Este suficient ca datele să fie stocate în cloud, chiar dacă decizia apare după ore.","Real-time înseamnă că toate nodurile folosesc TCP în loc de UDP."],"answer":0,"explanation":"Real-time este o cerință dependentă de aplicație și de bugetul de latență, mai ales când există control sau actuare.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 1 - Introduction","q":"Care combinație reflectă mai bine temele tehnice ale cursului IoT?","options":["Aplicații, rețele/protocoale, securitate, sisteme de operare pentru IoT și AI/ML la edge/cloud.","Design UI, baze de date relaționale, randare 3D și administrare de sisteme desktop.","Exclusiv programare Android, fără comunicații, securitate sau sisteme embedded.","Exclusiv criptografie teoretică, fără protocoale, senzori sau constrângeri hardware."],"answer":0,"explanation":"Cursul combină aplicații IoT, comunicații, securitate, OS pentru dispozitive constrained și AI/ML.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 1 - Introduction","q":"De ce nu este suficient să proiectezi o aplicație IoT ca pe o aplicație web clasică?","options":["Pentru că apar constrângeri de energie, memorie, latență, radio nesigur și interacțiune cu mediul fizic.","Pentru că IoT nu folosește niciodată protocoale de aplicație asemănătoare web-ului.","Pentru că toate dispozitivele IoT au resurse mai mari decât serverele web.","Pentru că IoT exclude complet folosirea cloud-ului și a analizelor de date."],"answer":0,"explanation":"Diferența majoră vine din constrângerile dispozitivelor și din conectarea cu lumea fizică, nu doar din software-ul de nivel aplicație.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 1 - Introduction","q":"Într-un sistem IoT academic, ce întrebare de proiectare este cea mai relevantă?","options":["Unde se procesează datele: pe nod, la gateway, în cloud sau într-o arhitectură hibridă?","Cum facem ca toate mesajele să folosească același font în interfața web?","Cum eliminăm complet nivelul de rețea pentru a simplifica implementarea?","Cum forțăm toate nodurile să trimită flux brut continuu indiferent de energie și bandwidth?"],"answer":0,"explanation":"Arhitectura IoT implică decizii despre locul procesării și compromisuri între latență, energie, bandwidth, confidențialitate și cost.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 1 - Introduction","q":"Care este o diferență relevantă între un obiect „smart” și un obiect doar electronic?","options":["Obiectul smart poate colecta/partaja date și poate participa la decizii sau automatizări prin conectivitate.","Obiectul smart trebuie obligatoriu să aibă ecran tactil și sistem de operare desktop.","Orice obiect alimentat electric este smart chiar dacă nu măsoară și nu comunică nimic.","Un obiect smart nu poate avea actuatori, doar senzori pasivi."],"answer":0,"explanation":"În IoT, caracterul smart vine din sensing/connectivitate/procesare/control, nu doar din faptul că obiectul este electronic.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 1 - Introduction","q":"Care este o capcană de proiectare frecventă în IoT?","options":["Trimiterea tuturor datelor brute în cloud fără a ține cont de energie, latență, confidențialitate și bandwidth.","Folosirea unui gateway pentru agregare când nodurile sunt constrânse.","Utilizarea IPv6 în rețele mari cu multe dispozitive adresabile.","Aplicarea unor mecanisme de securitate potrivite resurselor nodului."],"answer":0,"explanation":"Un design bun nu presupune automat „send everything to cloud”; trebuie analizat unde și cât se procesează.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 1 - Introduction","q":"Ce afirmație diferențiază corect IoT de o rețea IT tradițională?","options":["IoT include frecvent noduri embedded cu resurse limitate, amplasate în medii fizice și conectate la senzori/actuatori.","IoT presupune exclusiv servere puternice în datacenter și absența completă a dispozitivelor fizice.","IoT elimină protocoalele de rețea și folosește doar comunicație serială locală.","IoT este definit prin faptul că toate nodurile au ecran și tastatură."],"answer":0,"explanation":"IoT extinde rețelele către obiecte fizice constrained și către măsurare/control în mediu.","source":"IoT-SRIC-2026-Introduction"},{"course":"Curs 2 - WSN","q":"Care descriere este cea mai apropiată de arhitectura WSN din curs?","options":["Numeroase noduri senzor monitorizează mediul, trimit date către un sink/gateway, iar analiza poate continua în cloud.","O topologie cu un singur nod senzor care comunică doar cu un alt senzor, fără gateway sau procesare externă.","O rețea de servere cloud în care senzorii sunt emulați software și nu există mediu fizic.","O rețea cablată de mare viteză în care fiecare nod are resurse similare unui PC."],"answer":0,"explanation":"WSN presupune multe noduri cu rol de sensing, un sink/base station și de obicei stocare/analiză/procesare externă.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 2 - WSN","q":"De ce topologia star poate fi dezavantajoasă într-o WSN extinsă?","options":["Distanța directă până la gateway poate cere putere de transmisie mare și poate limita scalarea/acoperirea.","Necesită obligatoriu un protocol de rutare complex între toți senzorii, chiar dacă fiecare comunică direct cu gateway-ul.","Elimină complet consumul energetic, deci nu poate fi optimizată.","Nu permite niciun fel de adresare a nodurilor."],"answer":0,"explanation":"În star, avantajul simplității vine cu limita comunicării directe către gateway; distanța și scalarea devin probleme.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 2 - WSN","q":"În ce situație mesh/multi-hop este mai justificat decât star/single-hop?","options":["Când aria de acoperire este mare sau nodurile pot economisi energie retransmițând pe distanțe mai scurte.","Când toate nodurile sunt foarte aproape de gateway și traficul este minim.","Când se dorește eliminarea completă a rutării și a nodurilor forwarder.","Când mediul radio este perfect și nu există pierderi sau constrângeri de energie."],"answer":0,"explanation":"Mesh permite forwarderi și acoperire mai mare, cu costul rutării și al complexității suplimentare.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 2 - WSN","q":"Care compromis este specific nodurilor WSN?","options":["Cost și consum reduse, dar bandwidth, memorie, procesare și energie limitate.","Bandwidth nelimitat și energie nelimitată, dar cost mare doar la gateway.","Calcul intensiv local permanent, fără impact asupra bateriei.","Fiabilitate radio garantată matematic indiferent de mediu."],"answer":0,"explanation":"Nodurile WSN sunt mici, low-cost și low-power, dar au resurse și mediu de comunicație limitate.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 2 - WSN","q":"Ce rol are sink-ul/base station-ul într-o WSN?","options":["Colectează date de la noduri și poate transmite comenzi înapoi către acestea.","Înlocuiește complet toți senzorii și actuatorii din teren.","Funcționează doar ca mecanism de criptare la nivel aplicație.","Este întotdeauna un nod identic cu senzorii, fără resurse suplimentare."],"answer":0,"explanation":"Sink/base station este punctul de agregare și legătura cu procesarea/stocarea externă.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 2 - WSN","q":"Care afirmație despre mediul wireless într-o WSN este corectă?","options":["Poate fi nesigur și predispus la pierderi, deci protocoalele trebuie să țină cont de fiabilitate și energie.","Este întotdeauna mai fiabil decât cablul și nu necesită retransmisii.","Nu poate fi afectat de interferențe sau de poziționarea nodurilor.","Are mereu același bandwidth ca Ethernet gigabit."],"answer":0,"explanation":"WSN operează pe medii radio cu pierderi, interferențe și constrângeri de energie.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 2 - WSN","q":"De ce duty cycling este important în WSN?","options":["Permite nodurilor să doarmă periodic pentru a economisi energie, dar le face temporar indisponibile.","Forțează nodurile să rămână active permanent pentru latență minimă.","Înlocuiește complet rutarea multi-hop cu adresare IPv6.","Este un mecanism de criptare a payload-ului radio."],"answer":0,"explanation":"Duty cycling este un compromis între disponibilitate/latency și autonomie pe baterie.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 2 - WSN","q":"Care este diferența conceptuală între sensing și actuation în WSN/IoT?","options":["Sensing-ul observă mediul, actuation-ul modifică mediul pe baza unei comenzi sau decizii.","Sensing-ul trimite comenzi, actuation-ul măsoară pasiv temperatura.","Ambele înseamnă doar rutare de pachete la nivel IP.","Actuation-ul este posibil doar în cloud, niciodată pe dispozitiv."],"answer":0,"explanation":"Sensing și actuation sunt funcții complementare în interacțiunea cu mediul fizic.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 2 - WSN","q":"Care exemplu reflectă o cerință realistă pentru WSN?","options":["Monitorizare de mediu cu noduri low-power și transmitere periodică sau pe eveniment către un gateway.","Streaming video 8K continuu de pe fiecare senzor alimentat de o baterie mică.","Antrenarea locală a unui model mare pe fiecare nod cu microcontroller.","Actualizare a fiecărui nod exclusiv prin cablu, chiar dacă este amplasat remote."],"answer":0,"explanation":"WSN este potrivită pentru monitorizare distribuită cu trafic relativ mic și consum redus.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 2 - WSN","q":"Care afirmație despre ad-hoc network în context WSN este cea mai potrivită?","options":["Rețeaua poate fi formată din noduri care se organizează fără infrastructură fixă complexă, dar trebuie gestionate rutarea și fiabilitatea.","Ad-hoc înseamnă că nodurile nu au nevoie de identificatori și nu pot transmite date.","Ad-hoc garantează automat securitate end-to-end fără chei.","Ad-hoc exclude orice formă de topologie mesh."],"answer":0,"explanation":"Ad-hoc indică organizare flexibilă a nodurilor, dar aduce provocări de rutare, energie și securitate.","source":"IoT-SRIC-2026-WSN"},{"course":"Curs 3 - Protocoale","q":"În stiva IoT, care asociere între nivel și protocol este cea mai corectă?","options":["Application: CoAP/MQTT; Transport: UDP/TCP; Network: IPv6/RPL; Adaptation: 6LoWPAN; Link: IEEE 802.15.4/BLE/Wi‑Fi.","Application: IEEE 802.15.4; Transport: 6LoWPAN; Network: MQTT; Link: TLS.","Application: RPL; Transport: IPv6; Network: CoAP; Link: HTTP.","Application: AES-CCM; Transport: RFID; Network: WebSocket; Link: MQTT."],"answer":0,"explanation":"Stiva separă protocoalele de aplicație de transport, rețea, adaptare și link/PHY.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 3 - Protocoale","q":"Ce rol are IEEE 802.15.4 în ecosistemul IoT?","options":["Asigură nivelurile fizic și data-link pentru rețele low-power și stă la baza ZigBee, Thread, WirelessHART.","Este un protocol de aplicație pentru request-response similar HTTP.","Este un protocol de rutare pentru low-power and lossy networks.","Este o schemă de adresare IPv6 pe 128 de biți."],"answer":0,"explanation":"IEEE 802.15.4 este standard de link/PHY pentru rețele low-power, peste care se pot construi stive superioare.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 3 - Protocoale","q":"Ce consecință are frame-ul mic IEEE 802.15.4 asupra stivei IPv6?","options":["Este nevoie de mecanisme precum 6LoWPAN pentru compresie și fragmentare a pachetelor IPv6.","IPv6 poate fi transportat fără adaptare deoarece header-ul lui este mereu mai mic decât frame-ul disponibil.","TCP devine obligatoriu, iar UDP nu mai poate fi folosit.","CoAP nu mai poate avea metode GET/POST/PUT/DELETE."],"answer":0,"explanation":"Frame-ul 802.15.4 este mic, deci IPv6 are nevoie de adaptare pentru LLN.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 3 - Protocoale","q":"Ce descrie corect RPL?","options":["Protocol de rutare pentru low-power and lossy networks, folosit în special cu 6LoWPAN/IEEE 802.15.4.","Protocol de transport care înlocuiește UDP în CoAP.","Protocol de aplicație publish/subscribe pentru senzori.","Mecanism de compresie a headerului IPv6 la nivel adaptation."],"answer":0,"explanation":"RPL este protocol de rutare (IETF ROLL, RFC 6550) pentru rețele LLN.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 3 - Protocoale","q":"Care distincție între 6LoWPAN și RPL este corectă?","options":["6LoWPAN adaptează IPv6 la link-uri constrânse; RPL rezolvă rutarea în rețele low-power/lossy.","6LoWPAN este protocol de rutare, iar RPL comprimă headere IPv6.","Ambele sunt protocoale de aplicație și concurează direct cu MQTT.","Ambele sunt scheme de criptare la nivel data-link."],"answer":0,"explanation":"6LoWPAN și RPL sunt complementare, nu același tip de protocol.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 3 - Protocoale","q":"Care este implicația unei rate de date de până la 250 Kbps în IEEE 802.15.4?","options":["Aplicațiile trebuie să evite trafic brut voluminos și să prefere mesaje compacte/adaptate la resurse.","Este potrivită implicit pentru streaming video HD continuu de la fiecare nod.","Elimină necesitatea protocoalelor lightweight precum CoAP.","Permite folosirea fără cost a oricărui protocol enterprise greu."],"answer":0,"explanation":"Low data rate cere protocoale și aplicații eficiente.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 3 - Protocoale","q":"Care afirmație despre adresele MAC 802.15.4 este corectă?","options":["Pot exista adrese pe 64 de biți și adrese scurte pe 16 biți, utile în rețele low-power.","Sunt întotdeauna adrese IPv6 pe 128 de biți.","Sunt identice cu porturile UDP/TCP.","Nu există adresare la nivel data-link în 802.15.4."],"answer":0,"explanation":"Cursul menționează adrese MAC pe 64 sau 16 biți pentru IEEE 802.15.4.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 3 - Protocoale","q":"Care alegere de protocol este mai potrivită pentru un nod constrained care expune resurse REST-like?","options":["CoAP peste UDP, eventual securizat cu DTLS.","HTTP complet peste TCP/TLS fără a analiza memoria și energia.","AMQP enterprise indiferent de RAM/flash.","WebSocket permanent pentru fiecare citire rară de senzor."],"answer":0,"explanation":"Pentru resurse constrained și semantică similară HTTP, CoAP este proiectat ca alternativă lightweight.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 3 - Protocoale","q":"Ce diferențiază protocoalele de aplicație din stiva IoT de cele de link/PHY?","options":["Protocoalele de aplicație definesc interacțiunea logică/datele, iar link/PHY definesc transmiterea pe mediu radio/fizic.","Protocoalele de aplicație stabilesc direct frecvența radio, iar link/PHY definește JSON-ul payload-ului.","Nu există diferență; MQTT și IEEE 802.15.4 sunt același nivel.","Link/PHY rulează doar în cloud, iar aplicația doar pe antenă."],"answer":0,"explanation":"Separarea pe niveluri evită confuzia între semantică de aplicație și transportul fizic al biților.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 3 - Protocoale","q":"Într-o rețea IoT low-power, de ce nu alegem doar protocolul cu throughput maxim?","options":["Pentru că energia, dimensiunea frame-ului, latența, fiabilitatea și memoria pot conta mai mult decât throughput-ul brut.","Pentru că throughput-ul maxim garantează automat securitate și autonomie pe baterie.","Pentru că orice protocol de throughput mare comprimă automat IPv6.","Pentru că nodurile constrained au întotdeauna resurse suficiente pentru orice stivă."],"answer":0,"explanation":"IoT cere optimizarea mai multor constrângeri, nu doar viteză brută.","source":"IoT-SRIC-2026-Protocols"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"Care este relația corectă dintre IPv4, IPv6 și 6LoWPAN în curs?","options":["IPv4 are adresare pe 32 biți; IPv6 pe 128 biți; 6LoWPAN adaptează IPv6 pentru rețele low-power cu compresie/fragmentare.","IPv4 și 6LoWPAN folosesc 128 biți, iar IPv6 este doar pentru rețele fără senzori.","6LoWPAN este versiunea criptată a IPv4 și înlocuiește TCP.","IPv6 este un protocol de aplicație, iar 6LoWPAN este doar un tip de senzor."],"answer":0,"explanation":"Cursul distinge IPv4/IPv6 ca protocoale de rețea și 6LoWPAN ca layer de adaptare.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"De ce este necesară fragmentarea în 6LoWPAN?","options":["Pentru că un pachet IPv6 poate depăși dimensiunea disponibilă într-un frame 802.15.4.","Pentru că UDP cere fragmentare la fiecare mesaj, indiferent de dimensiune.","Pentru că IPv6 folosește doar 32 de biți și trebuie extins artificial.","Pentru că MQTT nu poate funcționa fără fragmentare 6LoWPAN."],"answer":0,"explanation":"Frame-ul mic al link-ului low-power poate necesita împărțirea pachetelor IPv6.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"Care regulă de scurtare IPv6 este corectă?","options":["„::” poate comprima o secvență consecutivă de grupuri zero, dar poate apărea o singură dată într-o adresă.","„::” poate apărea de mai multe ori dacă există mai multe secvențe de zerouri.","Leading zeros se păstrează obligatoriu pentru fiecare grup de 16 biți.","Zero compression modifică prefixul rețelei și schimbă adresa logică."],"answer":0,"explanation":"Regulile sunt: omiterea zerourilor de început din grupuri și folosirea o singură dată a „::” pentru zero compression.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"Ce reprezintă prefixul /64 într-o adresă IPv6?","options":["Numărul de biți din prefixul de rețea, adică partea fixă folosită pentru subnetare.","Numărul maxim de noduri permise în rețea.","Dimensiunea payload-ului CoAP în bytes.","Lungimea unei adrese MAC 802.15.4 în biți."],"answer":0,"explanation":"Prefixul indică numărul de biți folosiți pentru partea de rețea/subnet.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"Care este un motiv pentru compresia headerului în 6LoWPAN?","options":["Reducerea overhead-ului IPv6 pe link-uri cu frame mic și energie limitată.","Creșterea dimensiunii mesajului pentru a folosi complet bandwidth-ul.","Înlocuirea criptării DTLS cu o formă de securitate implicită.","Transformarea CoAP într-un protocol publish/subscribe."],"answer":0,"explanation":"Compresia headerului reduce bytes transmiși, important în LLN.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"Ce afirmație despre IPv6 în IoT este incompletă sau riscantă?","options":["IPv6 oferă adresare mare, dar poate fi costisitor pe rețele constrained fără adaptări precum 6LoWPAN.","IPv6 are 128 biți și poate susține rețele IoT mari.","IPv6 poate fi folosit împreună cu UDP/TCP și protocoale de aplicație.","IPv6 poate necesita mecanisme suplimentare de securitate sau adaptare."],"answer":0,"explanation":"IPv6 este util, dar overhead-ul lui trebuie gestionat pe link-uri constrained.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"Care asociere este corectă pentru „adaptation layer”?","options":["6LoWPAN se află între IPv6 și link-uri precum IEEE 802.15.4, făcând compresie și fragmentare.","MQTT se află între IPv6 și 802.15.4 pentru a comprima adresele.","TLS este adaptation layer pentru reducerea headerelor IPv6.","RPL este adaptation layer pentru metode GET/POST."],"answer":0,"explanation":"6LoWPAN adaptează IPv6 la constrângerile link-ului low-power.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"Ce capcană apare când comprimi o adresă IPv6 manual?","options":["Folosirea de două ori a „::” face adresa ambiguă și nu este permisă.","Omiterea zerourilor de început dintr-un grup este mereu interzisă.","Compresia zero elimină automat necesitatea prefixului.","Adresele IPv6 nu pot conține grupuri hexazecimale."],"answer":0,"explanation":"„::” o singură dată este esențial pentru a putea reconstrui adresa completă fără ambiguitate.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"Care descriere este cea mai precisă pentru „LLN”?","options":["Rețele low-power and lossy, cu noduri și link-uri constrânse, unde rutarea și overhead-ul trebuie optimizate.","Rețele locale de mare viteză cu pierderi inexistente și energie nelimitată.","Rețele exclusiv cablate, fără senzori și fără duty cycling.","Rețele care rulează doar HTTP și nu pot folosi IPv6."],"answer":0,"explanation":"LLN este contextul pentru RPL și 6LoWPAN: energie scăzută, pierderi, resurse limitate.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 4 - IPv6 & 6LoWPAN","q":"Într-o arhitectură 6LoWPAN, care combinație este plauzibilă?","options":["IEEE 802.15.4 la link, 6LoWPAN pentru adaptare, IPv6/RPL la rețea/rutare, CoAP la aplicație.","CoAP la link, MQTT la adaptation, 802.15.4 la aplicație, TLS la rutare.","IPv4 la link, WebSocket la network, Bluetooth ca protocol de aplicație.","AES-CCM la aplicație, HTTP ca nivel fizic, RPL ca senzor."],"answer":0,"explanation":"Aceasta este ordonarea tipică din stiva IoT constrained.","source":"IoT-SRIC-2026-6LoWPAN"},{"course":"Curs 5 - CoAP","q":"Ce caracterizează cel mai bine CoAP?","options":["Protocol de aplicație lightweight, REST-like, pentru dispozitive constrained, folosind de regulă UDP.","Protocol de rutare pentru LLN care construiește topologii mesh.","Protocol de link layer care definește frame-ul radio de 127 bytes.","Protocol publish/subscribe bazat obligatoriu pe broker central."],"answer":0,"explanation":"CoAP este Constrained Application Protocol: semantică web/REST pentru medii constrained.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - CoAP","q":"De ce CoAP folosește frecvent UDP în loc de TCP?","options":["Pentru overhead mai mic și consum redus, potrivit nodurilor cu resurse limitate.","Pentru a obține automat livrare ordonată și conexiune persistentă ca în TCP.","Pentru a elimina complet nevoia de mecanisme de fiabilitate la nivel CoAP.","Pentru că UDP oferă criptare end-to-end implicită."],"answer":0,"explanation":"UDP reduce overhead-ul, dar fiabilitatea trebuie tratată separat prin mecanisme CoAP când este necesar.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - CoAP","q":"Care set de metode este specific semanticii CoAP asemănătoare HTTP?","options":["GET, POST, PUT, DELETE.","PUBLISH, SUBSCRIBE, UNSUBSCRIBE, CONNECT.","SYN, ACK, FIN, RST.","SELECT, INSERT, UPDATE, JOIN."],"answer":0,"explanation":"CoAP mapează operații REST-like pe resurse prin metode similare HTTP.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - CoAP","q":"Ce rol are un proxy CoAP–HTTP?","options":["Permite interoperabilitatea între lumea web HTTP și dispozitive/servicii CoAP constrained.","Înlocuiește DTLS și face securitatea inutilă.","Transformă topologia star într-o topologie mesh fără rutare.","Comprimă automat toate modelele ML pentru TinyML."],"answer":0,"explanation":"Proxy-ul traduce între CoAP și HTTP pentru integrare Web of Things.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - CoAP","q":"Care cerință CoAP este legată de noduri care dorm?","options":["Duty cycle: nodurile pot dormi mare parte din timp și nu sunt întotdeauna disponibile.","Mutual exclusion: toate nodurile rulează doar un thread.","QoS 2: fiecare mesaj este livrat exact o dată prin broker.","Zero compression: fiecare adresă are „::”."],"answer":0,"explanation":"CoAP este proiectat ținând cont de noduri constrained și duty cycling.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - CoAP","q":"Ce opțiune explică cel mai bine „resource discovery” în CoAP?","options":["Mecanism prin care un client poate afla ce resurse expune un server CoAP constrained.","Procesul prin care RPL alege ruta cu rank minim.","Procesul prin care MQTT broker-ul persistă ultimul mesaj pe topic.","Procesul prin care 802.15.4 alege canalul radio cu energie minimă."],"answer":0,"explanation":"Resource discovery ține de identificarea resurselor expuse de un server CoAP.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - CoAP","q":"Care afirmație despre fiabilitatea CoAP este cea mai corectă?","options":["Deși rulează peste UDP, CoAP poate folosi retransmisii pentru mesaje confirmable.","Fiind peste UDP, CoAP nu poate implementa niciun mecanism de retransmisie.","CoAP se bazează obligatoriu pe TCP pentru orice mesaj important.","Fiabilitatea CoAP este oferită exclusiv de IPv6 zero compression."],"answer":0,"explanation":"CoAP poate adăuga fiabilitate la nivel aplicație pentru anumite tipuri de mesaje.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - CoAP","q":"Când ar fi CoAP o alegere mai bună decât HTTP clasic?","options":["Când dispozitivul este constrained, pe baterie, cu link low-power și overhead-ul HTTP/TLS este prea mare.","Când ai nevoie de browsere web complete și resurse server nelimitate.","Când aplicația necesită sesiuni TCP lungi și broker central publish/subscribe.","Când datele sunt video brut de mare volum și latența nu contează."],"answer":0,"explanation":"CoAP este proiectat tocmai pentru resurse limitate și comunicație eficientă.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - CoAP","q":"Care interpretare despre DTLS în CoAP este corectă?","options":["DTLS securizează traficul peste UDP, fiind analogul TLS pentru datagrame.","DTLS este un protocol de rutare care înlocuiește RPL.","DTLS comprimă headere IPv6 ca 6LoWPAN.","DTLS oferă metode GET/POST/PUT/DELETE."],"answer":0,"explanation":"CoAP folosește DTLS pentru securitate peste UDP.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - CoAP","q":"Care opțiune compară corect CoAP cu HTTP?","options":["Ambele pot avea semantică REST, dar CoAP este adaptat pentru constrained environments și UDP.","CoAP este identic cu HTTP și diferă doar prin numele metodelor.","HTTP este un protocol de link layer, iar CoAP este un protocol de rutare.","CoAP nu permite reprezentarea resurselor și nu poate fi mapat spre HTTP."],"answer":0,"explanation":"CoAP păstrează ideea de resurse/metode, dar reduce overhead-ul și se potrivește IoT constrained.","source":"IoT-SRIC-2026-CoAP&MQTT"},{"course":"Curs 5 - MQTT","q":"Care descrie cel mai corect modelul MQTT?","options":["Publish/subscribe prin broker: publisherii trimit pe topicuri, subscriberii primesc mesajele relevante.","Request/response direct între client și server, fără intermediar și fără topicuri.","Rutare mesh la nivel IP pentru low-power and lossy networks.","Compresie de header IPv6 pentru frame-uri 802.15.4."],"answer":0,"explanation":"MQTT decuplează producătorii și consumatorii prin broker și topicuri.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 5 - MQTT","q":"Ce diferență de model între CoAP și MQTT este relevantă?","options":["CoAP este preponderent request-response REST-like; MQTT este publish/subscribe prin broker.","CoAP este publish/subscribe prin broker; MQTT este doar GET/POST/PUT/DELETE.","Ambele sunt protocoale de link layer și nu au semantică de aplicație.","Ambele înlocuiesc complet transportul UDP/TCP."],"answer":0,"explanation":"CoAP și MQTT rezolvă nevoi diferite la nivel aplicație.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 5 - MQTT","q":"Ce rol are brokerul MQTT?","options":["Primește mesaje de la publisheri și le distribuie subscriberilor pe baza topicurilor.","Comprimă adrese IPv6 și fragmentează pachete pentru 802.15.4.","Alege rutele RPL în rețele mesh.","Execută exclusiv criptare AES-CCM la nivel data-link."],"answer":0,"explanation":"Brokerul este elementul central al arhitecturii publish/subscribe MQTT.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 5 - MQTT","q":"Ce avantaj oferă publish/subscribe în IoT?","options":["Decuplează în timp și spațiu producătorii de date de consumatori, util când există mai multe aplicații interesate de aceleași topicuri.","Elimină necesitatea unui broker sau a unei infrastructuri de mesagerie.","Garantează automat latență zero și livrare exact o dată pentru orice configurație.","Face imposibilă filtrarea mesajelor pe categorii sau topicuri."],"answer":0,"explanation":"Pub/sub reduce cuplarea directă între noduri și consumatori, dar introduce broker și management de topicuri.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 5 - MQTT","q":"Ce reprezintă un topic MQTT?","options":["O etichetă ierarhică folosită pentru rutarea mesajelor între publisheri și subscriberi.","O adresă MAC 802.15.4 pe 16 biți.","Un fragment IPv6 generat de 6LoWPAN.","O cheie criptografică folosită de DTLS."],"answer":0,"explanation":"Topicurile organizează fluxurile de mesaje MQTT.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 5 - MQTT","q":"Care afirmație despre QoS în MQTT este cea mai corectă?","options":["QoS exprimă nivelul de garanție al livrării mesajului, cu costuri diferite de overhead și latență.","QoS este mecanismul prin care se comprimă headerele IPv6.","QoS înseamnă că toate mesajele sunt obligatoriu livrate exact o dată fără cost suplimentar.","QoS este un protocol de rutare alternativ la RPL."],"answer":0,"explanation":"Nivelurile QoS implică trade-off între garanții și overhead.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 5 - MQTT","q":"Când MQTT poate fi preferat față de CoAP?","options":["Când există multe surse și consumatori de evenimente/telemetrie, iar decuplarea prin broker și topicuri este utilă.","Când vrei interogare REST directă a unei resurse pe un nod fără infrastructură de broker.","Când link-ul nu permite niciun tip de conexiune persistentă sau sesiune.","Când aplicația cere exclusiv metode GET/PUT pe resurse locale."],"answer":0,"explanation":"MQTT este potrivit pentru telemetrie pub/sub și M2M cu broker.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 5 - MQTT","q":"Ce risc arhitectural apare la MQTT dacă brokerul nu este proiectat redundant?","options":["Brokerul poate deveni punct central de eșec sau bottleneck pentru comunicații.","Publisherii devin automat senzori fără consum energetic.","CoAP nu mai poate folosi UDP în aceeași rețea.","6LoWPAN nu mai poate fragmenta pachete IPv6."],"answer":0,"explanation":"Brokerul facilitează decuplarea, dar centralizarea lui trebuie tratată prin disponibilitate și scalare.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 5 - MQTT","q":"Ce funcție are un mesaj retained în MQTT?","options":["Permite brokerului să păstreze ultimul mesaj pe un topic pentru a-l livra noilor subscriberi.","Forțează fiecare nod să repornească la primirea unui mesaj.","Este un mecanism de autentificare WPA3 Enterprise.","Este fragmentul final al unui pachet 6LoWPAN."],"answer":0,"explanation":"Retained messages ajută subscriberii noi să obțină ultima stare cunoscută.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 5 - MQTT","q":"Ce este Last Will and Testament în MQTT?","options":["Un mesaj configurat de client, publicat de broker dacă acel client se deconectează neașteptat.","O comandă CoAP DELETE trimisă la fiecare închidere normală.","Un nivel de securitate AES-CCM-128 pentru 802.15.4.","O regulă de scurtare IPv6 pentru grupuri zero."],"answer":0,"explanation":"LWT este util pentru semnalarea că un dispozitiv a devenit offline neașteptat.","source":"IoT-SRIC-2026-CoAP&MQTT / IoT-SRIC-2026-Protocols"},{"course":"Curs 6 - Atacuri IoT","q":"De ce atacurile fizice sunt deosebit de relevante în IoT?","options":["Dispozitivele pot fi amplasate remote/nesupravegheat, iar atacatorul poate avea acces fizic la nod sau canal.","IoT rulează exclusiv în datacentere securizate fără contact cu mediul fizic.","Atacurile fizice sunt imposibile dacă dispozitivul are adresă IPv6.","Atacurile fizice sunt identice cu atacurile de aplicație și nu necesită proximitate."],"answer":0,"explanation":"Cursul menționează locații remote și nesupravegheate ca factor de risc.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 6 - Atacuri IoT","q":"Care combinație aparține categoriei de atacuri fizice din curs?","options":["Tampering, malicious code injection, RF interference/jamming, fake node injection, sleep denial, side-channel.","SQL injection, XSS, CSRF și buffer overflow pe aplicații web.","QoS 0, QoS 1, retained messages și LWT.","Zero compression, header compression, fragmentation și prefix /64."],"answer":0,"explanation":"Aceste atacuri vizează dispozitivul, canalul fizic sau efectele implementării.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 6 - Atacuri IoT","q":"Ce urmărește un atac de jamming/RF interference?","options":["Introducerea de zgomot/interferență pe canal pentru a împiedica comunicarea, provocând DoS.","Compresia headerelor IPv6 pentru a reduce overhead-ul radio.","Creșterea duratei de somn a nodurilor pentru a economisi baterie.","Autentificarea dispozitivelor prin certificate."],"answer":0,"explanation":"Jamming-ul afectează disponibilitatea prin blocarea canalului wireless.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 6 - Atacuri IoT","q":"Care explicație pentru sleep denial este corectă?","options":["Atacatorul împiedică nodul să intre în sleep/duty cycle, consumând bateria și generând DoS.","Atacatorul comprimă traficul pentru ca nodul să trimită mai puține date.","Atacatorul reduce timpul de activitate al nodului și îi prelungește autonomia.","Atacul vizează exclusiv confidențialitatea mesajului, nu energia."],"answer":0,"explanation":"Sleep denial exploatează mecanismele de economisire a energiei prin menținerea nodului treaz.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 6 - Atacuri IoT","q":"Ce este fake node injection?","options":["Inserarea unui nod malițios în rețea pentru captură de trafic, perturbare sau lansarea altor atacuri.","Adăugarea unui gateway legitim pentru redundanță.","Comprimarea unei adrese IPv6 cu două puncte duble.","Publicarea ultimului mesaj MQTT la reconectare."],"answer":0,"explanation":"Fake node injection atacă topologia și încrederea în nodurile participante.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 6 - Atacuri IoT","q":"Care este diferența dintre tampering și jamming?","options":["Tampering implică modificare fizică a dispozitivului/canalului, jamming-ul perturbă comunicația radio prin zgomot/interferență.","Tampering este un protocol de securitate, iar jamming-ul este un mecanism de rutare.","Tampering se referă la QoS MQTT, iar jamming-ul la retained messages.","Nu există diferență; ambele sunt doar compresii 6LoWPAN."],"answer":0,"explanation":"Ambele pot fi fizice, dar vectorul și efectul sunt diferite.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 6 - Atacuri IoT","q":"Ce urmărește un atac side-channel?","options":["Extragerea de informații din efecte fizice ale implementării, precum consumul de energie sau timing-ul.","Injectarea unui mesaj CoAP GET pentru a descoperi resurse.","Fragmentarea unui pachet IPv6 în bucăți mai mici.","Rutarea datelor printr-un broker MQTT compromis."],"answer":0,"explanation":"Side-channel exploatează informații externe execuției logice, cum ar fi puterea consumată.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 6 - Atacuri IoT","q":"Care atac afectează cel mai direct disponibilitatea?","options":["DDoS/botnet IoT sau jamming, deoarece împiedică serviciul/comunicația să funcționeze normal.","Omiterea zerourilor de început din IPv6.","Folosirea unui prefix /64 într-o adresă IPv6.","Folosirea windowing-ului în feature engineering."],"answer":0,"explanation":"DDoS și jamming sunt exemple directe de atacuri asupra disponibilității.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 6 - Atacuri IoT","q":"De ce botneturile IoT sunt periculoase?","options":["Multe dispozitive compromise pot genera trafic coordonat masiv către o victimă DDoS.","Fiecare dispozitiv IoT are mereu throughput mic, deci nu poate contribui la trafic malițios.","Botnetul este un mecanism legitim de load balancing pentru MQTT.","Un botnet IoT funcționează doar dacă toate dispozitivele sunt offline."],"answer":0,"explanation":"Botneturile exploatează numărul mare de dispozitive vulnerabile conectate la Internet.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 6 - Atacuri IoT","q":"Care este o cerință realistă pentru apărare în IoT constrained?","options":["Soluții lightweight, adaptate CPU/memorie/energie, nu mecanisme grele aplicate fără analiză.","Să dezactivăm orice securitate pentru a salva energie.","Să presupunem că dispozitivele remote nu pot fi atinse fizic.","Să folosim exclusiv algoritmi CPU-intensive pe toate nodurile, indiferent de hardware."],"answer":0,"explanation":"Cursul evidențiază nevoia de soluții lightweight pentru dispozitive resource constrained.","source":"IoT-SRIC-2026-Security"},{"course":"Curs 8 - Soluții securitate","q":"Care interpretare a modelului CIA este corectă?","options":["Confidențialitatea limitează citirea neautorizată, integritatea previne modificarea neautorizată, disponibilitatea menține serviciul funcțional.","Confidențialitatea garantează uptime, integritatea ascunde conținutul, disponibilitatea comprimă mesajele.","CIA se aplică doar aplicațiilor cloud, nu și dispozitivelor IoT.","CIA este un protocol concret care înlocuiește DTLS, TLS și IPsec."],"answer":0,"explanation":"CIA este modelul de bază pentru cerințe de securitate, nu un protocol unic.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs 8 - Soluții securitate","q":"Ce provocare de securitate IoT rezultă din resursele limitate?","options":["Nu poți aplica orice soluție grea; mecanismele trebuie alese în funcție de CPU, memorie, energie și latență.","Toate dispozitivele pot rula fără cost suite enterprise complete.","Resursele limitate elimină automat suprafața de atac.","Criptarea devine inutilă dacă dispozitivul are baterie mică."],"answer":0,"explanation":"Securitatea trebuie proiectată realist pentru dispozitive constrained.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs 8 - Soluții securitate","q":"Care asociere din tabelul de soluții pe stivă este corectă?","options":["Transport UDP/TCP → DTLS/TLS; Network IP → IPsec; Data-link IEEE 802.15.4 → 802.15.4 security.","Transport UDP/TCP → RPL security; Network IP → CoAP user-defined; Data-link IEEE 802.15.4 → TLS.","Transport → 6LoWPAN none; Network → MQTT; Data-link → HTTP.","Application → AES-CTR obligatoriu; Routing → WPA3 Enterprise; 6LoWPAN → DTLS."],"answer":0,"explanation":"Tabelul separă soluții pe niveluri: aplicație, transport, network, routing, data-link.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs 8 - Soluții securitate","q":"Ce înseamnă scope „per-hop” pentru securitate?","options":["Protecția este aplicată între vecini/link-uri succesive, nu neapărat între capetele finale ale comunicației.","Protecția acoperă întotdeauna sender-ul și receiver-ul final, indiferent de intermediari.","Protecția se aplică doar payload-ului aplicației fără a afecta link-ul.","Protecția este identică cu zero compression IPv6."],"answer":0,"explanation":"Per-hop diferă de end-to-end; fiecare hop poate avea protecție proprie.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs 8 - Soluții securitate","q":"De ce „security by design” este importantă în IoT?","options":["Pentru că adăugarea securității după proiectare poate fi dificilă pe dispozitive constrained și deja distribuite.","Pentru că securitatea poate fi ignorată dacă protocolul este low-power.","Pentru că orice firmware OTA este automat sigur fără semnături.","Pentru că un dispozitiv mic nu poate fi atacat."],"answer":0,"explanation":"Cursul spune că security by design nu a fost mereu prioritar, dar este necesar din cauza suprafeței de atac.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs 8 - Soluții securitate","q":"Ce rol are un nonce în confidențialitatea IEEE 802.15.4?","options":["Diferențiază mesaje similare/identice în criptare și ajută la securitatea semantică.","Înlocuiește cheia secretă și poate fi publicat ca singur mecanism de securitate.","Este o adresă IPv6 comprimată cu „::”.","Este un topic MQTT folosit pentru QoS 2."],"answer":0,"explanation":"Nonce-ul este trimis în clar, dar trebuie să fie unic/adecvat pentru a evita repetarea fluxului criptografic.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs 8 - Soluții securitate","q":"Care suite IEEE 802.15.4 oferă atât confidențialitate, cât și integritate?","options":["AES-CCM-32/64/128.","None.","AES-CBC-MAC-32/64/128 fără criptare.","6LoWPAN header compression."],"answer":0,"explanation":"În tabel, AES-CCM combină criptarea cu autentificarea/integritatea.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs 8 - Soluții securitate","q":"Ce înseamnă NoSec în context CoAP + DTLS?","options":["Nu se folosește DTLS; traficul rulează peste UDP fără protecția oferită de DTLS.","Se folosește DTLS cu certificate obligatorii.","Se folosește IPsec la nivel rețea cu scope E2E.","Se folosește WPA3 Enterprise 192-bit mode."],"answer":0,"explanation":"Cursul menționează NoSec ca mod fără DTLS, doar UDP.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs 8 - Soluții securitate","q":"De ce WPA3 Enterprise 192-bit poate fi nepotrivit pentru unele dispozitive IoT?","options":["Poate fi prea costisitor pentru dispozitive resource constrained, deși oferă securitate mai puternică.","Nu oferă autentificare și nu folosește criptare autentificată.","Este un protocol de aplicație pentru CoAP, nu Wi-Fi.","Funcționează numai peste IEEE 802.15.4, nu Wi-Fi."],"answer":0,"explanation":"Cursul notează că modul 192-bit este mai puternic, dar nu poate fi folosit pe dispozitive constrained.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs 8 - Soluții securitate","q":"Care este o strategie mai corectă pentru update-uri OTA în IoT?","options":["Firmware semnat și verificat, pentru a preveni instalarea codului neautorizat.","Update-uri nesemnate, pentru că rețeaua locală este considerată mereu sigură.","Trimiterea cheilor private în payload pentru validare rapidă.","Dezactivarea update-urilor pentru a evita orice atac, indiferent de vulnerabilități."],"answer":0,"explanation":"Update-urile OTA sunt necesare, dar trebuie securizate prin semnare/verificare.","source":"IoT-SRIC-2025-Security-2"},{"course":"Curs AI & ML","q":"Care lanț descrie corect transformarea datelor de senzor pentru ML?","options":["Sampling → cuantizare/compresie → denoising/normalizare → sincronizare temporală → feature engineering/inferență.","Jamming → fake node injection → sleep denial → PDoS → inferență.","Zero compression → RPL rank → DTLS handshake → broker MQTT.","AES-CCM → WPA3 → IPsec → frame 802.15.4."],"answer":0,"explanation":"Cursul prezintă pregătirea semnalelor brute înainte de a deveni date utile pentru ML.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs AI & ML","q":"De ce este importantă sincronizarea temporală între dispozitive?","options":["Pentru corelarea corectă a observațiilor produse de senzori diferiți în același fenomen.","Pentru a mări artificial rata de eșantionare peste limita Nyquist.","Pentru a elimina complet zgomotul fără filtrare.","Pentru a înlocui nevoia de etichete în toate modelele ML."],"answer":0,"explanation":"Datele multi-senzor pot fi interpretate greșit dacă timestamp-urile nu sunt aliniate.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs AI & ML","q":"Care este rolul feature engineering-ului pe date de senzori?","options":["Extrage reprezentări utile precum ferestre statistice, caracteristici în frecvență sau semnături de domeniu.","Criptează payload-ul radio folosind AES-CCM.","Fragmentează pachetele IPv6 în cadre 802.15.4.","Înlocuiește brokerul MQTT pentru publish/subscribe."],"answer":0,"explanation":"Feature engineering transformă semnale brute în intrări informative pentru modele.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs AI & ML","q":"Când este edge inference preferabilă cloud inference?","options":["Când latența, confidențialitatea, funcționarea offline sau bandwidth-ul sunt critice.","Când modelul necesită resurse nelimitate și datele nu au constrângeri de confidențialitate.","Când dispozitivul nu are niciun senzor local și produce doar rapoarte batch.","Când se dorește trimiterea permanentă a datelor brute fără filtrare."],"answer":0,"explanation":"Edge reduce latența și traficul și păstrează datele local, dar este constrâns de hardware.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs AI & ML","q":"Ce definește cel mai bine TinyML?","options":["Inferență ML pe microcontrollere ultra-low-power, pentru sensing always-on și cazuri precum wake-word/gesture/leak detection.","Antrenarea unui LLM mare pe un cluster cloud pentru aplicații IoT.","Un protocol de transport lightweight pentru mesaje de senzor.","O schemă de compresie a adreselor IPv6."],"answer":0,"explanation":"TinyML vizează ML pe hardware foarte constrâns, sub bugete energetice mici.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs AI & ML","q":"Care tehnică reduce costul unui model pentru edge/TinyML?","options":["Quantization, pruning, knowledge distillation sau arhitecturi cu FLOPs reduși.","Creșterea numărului de parametri fără limită și dezactivarea compresiei.","Trimiterea fiecărui frame video brut către toate nodurile.","Înlocuirea tuturor senzorilor cu broker MQTT."],"answer":0,"explanation":"Model compression permite rularea pe hardware mai mic cu energie și memorie limitate.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs AI & ML","q":"Care este un trade-off al cuantizării unui model?","options":["Reduce memorie/calcul, dar poate afecta acuratețea dacă este aplicată agresiv.","Crește întotdeauna acuratețea și dimensiunea modelului simultan.","Elimină complet nevoia de date de antrenare.","Înlocuiește protocolul de securitate DTLS."],"answer":0,"explanation":"Quantization reduce precizia numerică, economisind resurse cu posibil cost în performanță.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs AI & ML","q":"Ce descrie cel mai bine arhitectura hibridă edge-cloud?","options":["Edge face filtrare/inferență rapidă locală, cloud-ul face analiză mai grea sau rafinare pe context global.","Cloud-ul este eliminat complet, iar edge-ul face inclusiv antrenări masive permanent.","Edge-ul doar stochează date brute, iar cloud-ul controlează direct fiecare actuator sub 1 ms.","Este o schemă de criptare end-to-end pentru CoAP."],"answer":0,"explanation":"Hibridul combină latența mică și contextul local cu puterea analitică a cloud-ului.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs AI & ML","q":"Care aplicație este potrivită pentru ML în IoT conform cursului?","options":["Predictive maintenance, anomaly detection, activity/gesture recognition sau energy optimization.","Adresarea IPv6 prin prefixe și compresie zero.","Înlocuirea nivelului fizic al 802.15.4.","Calcularea manuală a cheilor WPA3."],"answer":0,"explanation":"Cursul listează aceste cazuri ca utilizări tipice ML în IoT.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs AI & ML","q":"De ce „send insights, not raw video” este o idee importantă?","options":["Pentru că reduce bandwidth-ul și poate proteja confidențialitatea, trimițând rezultate în locul datelor brute voluminoase.","Pentru că video brut este întotdeauna mai mic decât un rezultat de clasificare.","Pentru că edge inference nu poate produce niciodată insight-uri locale.","Pentru că cloud-ul nu poate procesa date video."],"answer":0,"explanation":"Edge intelligence poate trimite evenimente/clase/anomalii în locul fluxurilor brute.","source":"IoT-SRIC-2026-AI&ML"},{"course":"Curs Zephyr RTOS","q":"Ce cerință de RTOS este specifică dispozitivelor IoT constrained?","options":["Gestionarea eficientă a RAM/flash, scheduling predictibil, power management, conectivitate și securitate configurabile.","Rulare exclusivă pe servere x86 cu memorie nelimitată.","Interfață grafică desktop obligatorie pentru fiecare nod.","Eliminarea driverelor și a stivelor de comunicație."],"answer":0,"explanation":"RTOS-ul trebuie să ofere predictibilitate și servicii configurabile sub constrângeri de resurse.","source":"IoT-SRIC-2026-Zephyr"},{"course":"Curs Zephyr RTOS","q":"Care este rolul Kconfig în workflow-ul Zephyr?","options":["Configurarea opțiunilor software/feature-urilor activate în build.","Descrierea fizică a pinilor și perifericelor hardware în format de device tree.","Protocolul de rutare pentru rețele low-power and lossy.","Mecanismul de criptare folosit de DTLS."],"answer":0,"explanation":"Kconfig controlează selecția opțiunilor software; Devicetree descrie hardware-ul.","source":"IoT-SRIC-2026-Zephyr"},{"course":"Curs Zephyr RTOS","q":"Care este rolul Devicetree în Zephyr?","options":["Descrie hardware-ul plăcii/perifericele, ajutând la portabilitate între board-uri.","Selectează algoritmul ML folosit în cloud.","Înlocuiește scheduler-ul kernelului.","Publică mesaje MQTT către broker."],"answer":0,"explanation":"Devicetree separă descrierea hardware de logica aplicației.","source":"IoT-SRIC-2026-Zephyr"},{"course":"Curs Zephyr RTOS","q":"Ce face west în ecosistemul Zephyr?","options":["Ajută la managementul workspace-ului/proiectelor și la comenzi de build/flash în workflow.","Este protocolul de securitate end-to-end pentru UDP.","Este un driver radio 802.15.4 obligatoriu.","Este un algoritm de compresie TinyML."],"answer":0,"explanation":"west este unealta de management și workflow în Zephyr.","source":"IoT-SRIC-2026-Zephyr"},{"course":"Curs Zephyr RTOS","q":"Care diferență între thread preemptiv și cooperativ este relevantă?","options":["Un thread preemptiv poate fi întrerupt de unul cu prioritate mai mare; un thread cooperativ cedează controlul explicit.","Thread-ul cooperativ rulează doar în cloud, iar cel preemptiv doar pe gateway.","Preemptiv înseamnă fără priorități, cooperativ înseamnă doar time slicing.","Nu există diferență pe MCUs; ambele sunt doar task-uri batch."],"answer":0,"explanation":"Scheduling-ul RTOS gestionează priorități, preempțiune și cooperare pentru predictibilitate.","source":"IoT-SRIC-2026-Zephyr"},{"course":"Curs Zephyr RTOS","q":"De ce este important să activezi doar stack-urile necesare în Zephyr/IoT?","options":["Pentru a reduce consumul de RAM/flash și suprafața de atac a firmware-ului.","Pentru a crește artificial dimensiunea firmware-ului pentru debugging.","Pentru a obliga dispozitivul să folosească toate protocoalele simultan.","Pentru că protocoalele inactive consumă întotdeauna mai multă energie decât cele active."],"answer":0,"explanation":"Cursul subliniază activarea doar a componentelor necesare pentru reducerea resurselor folosite.","source":"IoT-SRIC-2026-Zephyr"},{"course":"Curs Zephyr RTOS","q":"Care combinație aparține stivei de conectivitate menționate în cursul Zephyr?","options":["CoAP/MQTT/HTTP/LwM2M, DTLS/TLS, UDP/TCP, IPv6/RPL, 6LoWPAN, 802.15.4/BLE/Wi‑Fi/CAN.","SQL/NoSQL, HTML/CSS, GPU shaders și WebAssembly.","Only FTP/Telnet, fără securitate și fără IPv6.","Doar USB, HDMI și DisplayPort la nivel aplicație."],"answer":0,"explanation":"Zephyr poate integra mai multe componente de conectivitate IoT, configurabile în funcție de nevoie.","source":"IoT-SRIC-2026-Zephyr"},{"course":"Curs Zephyr RTOS","q":"Ce așteptări moderne pentru firmware IoT apar în curs?","options":["Secure boot, update-uri semnate, izolare unde hardware-ul permite, testabilitate și observabilitate.","Lipsa completă a logării și imposibilitatea de a actualiza firmware-ul.","Cod nereproductibil, fără CI, pentru a reduce complexitatea.","Dezactivarea securității pentru a accelera boot-ul."],"answer":0,"explanation":"Firmware-ul modern IoT trebuie să fie actualizabil, observabil, testabil și securizat.","source":"IoT-SRIC-2026-Zephyr"},{"course":"Curs Zephyr RTOS","q":"Care este un motiv pentru folosirea unui RTOS în locul unui loop simplu?","options":["Coordonarea predictibilă a mai multor activități: senzori, comunicație, timeout-uri, power management și evenimente concurente.","Eliminarea oricărei nevoi de drivere și interrupt-uri.","Obținerea automată a securității end-to-end fără configurare.","Înlocuirea protocoalelor de rețea cu o singură variabilă globală."],"answer":0,"explanation":"RTOS-ul devine util când aplicația are concurență, timpi, priorități și servicii OS.","source":"IoT-SRIC-2026-Zephyr"},{"course":"Curs Zephyr RTOS","q":"Care afirmație compară corect Zephyr cu un OS desktop?","options":["Zephyr este orientat spre embedded/IoT, configurabil și modular, pentru resurse limitate și multe plăci hardware.","Zephyr este un OS desktop generalist cu GUI obligatoriu și drivere pentru imprimante office.","Zephyr rulează doar în cloud și nu interacționează cu hardware embedded.","Zephyr este doar o bibliotecă MQTT fără kernel."],"answer":0,"explanation":"Zephyr este RTOS/OS embedded modular, nu un OS desktop clasic.","source":"IoT-SRIC-2026-Zephyr"}];
const key = 'iot_sric_quiz_progress_v3_academic';
const orderKey = 'iot_sric_quiz_option_order_v3_academic';
let state = JSON.parse(localStorage.getItem(key)||'{}');
let optionOrder = JSON.parse(localStorage.getItem(orderKey)||'null');
let order = QUESTIONS.map((_,i)=>i);
let forceAnswers = false;
const $=s=>document.querySelector(s);
const save=()=>localStorage.setItem(key,JSON.stringify(state));
const saveOrder=()=>localStorage.setItem(orderKey,JSON.stringify(optionOrder));
function shuffleArray(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function regenerateOptionOrder(){optionOrder = QUESTIONS.map(q=>shuffleArray(q.options.map((_,i)=>i))); saveOrder();}
function ensureOptionOrder(){if(!optionOrder || optionOrder.length!==QUESTIONS.length || optionOrder.some((x,i)=>!Array.isArray(x)||x.length!==QUESTIONS[i].options.length)){regenerateOptionOrder();}}
function courses(){return [...new Set(QUESTIONS.map(q=>q.course))];}
function init(){
  ensureOptionOrder();
  $('#totalBadge').textContent = QUESTIONS.length + ' întrebări ';
  $('#courseFilter').innerHTML = '<option value="all">Toate cursurile</option>' + courses().map(c=>`<option>${c}</option>`).join('');
  $('#courseChips').innerHTML = courses().map(c=>`<span class="chip">${c}</span>`).join('');
  ['search','courseFilter','mode'].forEach(id=>$('#'+id).addEventListener('input',render));
  $('#shuffleBtn').onclick=()=>{order=shuffleArray(order);render();};
  $('#resetBtn').onclick=()=>{if(confirm('Sigur resetezi progresul? Se vor reamesteca și variantele A/B/C/D.')){state={};regenerateOptionOrder();save();render();}};
  $('#showAnswersBtn').onclick=()=>{forceAnswers=!forceAnswers;$('#showAnswersBtn').textContent=forceAnswers?'Ascunde răspunsurile':'Arată răspunsurile';render();};
  $('#nextWrongBtn').onclick=()=>{$('#mode').value='wrong';render();window.scrollTo({top:0,behavior:'smooth'});};
  render();
}
function filtered(){
  const s=$('#search').value.trim().toLowerCase(), c=$('#courseFilter').value, m=$('#mode').value;
  return order.filter(i=>{const q=QUESTIONS[i], st=state[i];
    if(c!='all' && q.course!==c) return false;
    if(s && !(q.q+' '+q.options.join(' ')+' '+q.explanation+' '+q.course).toLowerCase().includes(s)) return false;
    if(m==='unanswered' && st) return false;
    if(m==='wrong' && (!st || st.correct)) return false;
    return true;
  });
}
function renderStats(){
  const vals=Object.values(state); const answered=vals.length; const correct=vals.filter(x=>x.correct).length;
  $('#score').textContent=correct; $('#answered').textContent=answered;
  $('#bar').style.width=(QUESTIONS.length?answered/QUESTIONS.length*100:0)+'%';
  const pct=answered?Math.round(correct/answered*100):0;
  $('#summary').innerHTML=`Scor curent: <b>${pct}%</b><br>${answered}/${QUESTIONS.length} rezolvate. ${vals.filter(x=>!x.correct).length} greșite de repetat.<br><br><b>Notă:</b> variantele greșite sunt intenționat apropiate conceptual. Citește explicația după fiecare răspuns.`;
}
function render(){
  renderStats();
  const list=filtered(), root=$('#questions');
  if(!list.length){root.innerHTML='<div class="empty">Nu există întrebări pentru filtrul ales.</div>';return;}
  root.innerHTML=list.map((i,pos)=>card(i,pos)).join('');
  list.forEach(i=>{optionOrder[i].forEach((origIdx,shownIdx)=>{document.getElementById(`q${i}o${shownIdx}`)?.addEventListener('click',()=>answer(i,origIdx));});});
}
function card(i,pos){
  const q=QUESTIONS[i], st=state[i], reveal=forceAnswers||st; const selected=st?.selected;
  const opts=optionOrder[i].map((origIdx,shownIdx)=>{const o=q.options[origIdx]; let cls='opt'; if(reveal){cls+=' disabled'; if(origIdx===q.answer) cls+=' correct'; if(selected===origIdx && selected!==q.answer) cls+=' wrong';}
    return `<button class="${cls}" id="q${i}o${shownIdx}" ${reveal?'disabled':''}><b>${String.fromCharCode(65+shownIdx)}.</b> ${escapeHtml(o)}</button>`}).join('');
  const fbClass = reveal ? (selected===q.answer || forceAnswers ? 'show good':'show bad') : '';
  const verdict = !reveal ? '' : (selected===q.answer ? 'Corect.' : forceAnswers && !st ? 'Răspuns afișat.' : 'Greșit.');
  const correctShown = optionOrder[i].indexOf(q.answer);
  const correctLabel = correctShown>=0 ? String.fromCharCode(65+correctShown) : '?';
  const correctInfo = reveal && selected!==q.answer ? ` Răspuns corect: ${correctLabel}.` : '';
  return `<section class="question-card"><div class="qtop"><span class="tag">${escapeHtml(q.course)}</span><span class="qnum">#${i+1}</span></div><div class="question">${escapeHtml(q.q)}</div><div class="options">${opts}</div><div class="feedback ${fbClass}"><b>${verdict}</b>${correctInfo} ${escapeHtml(q.explanation)}<div class="source">Sursă: ${escapeHtml(q.source)}</div></div></section>`;
}
function answer(i,origIdx){
  state[i]={selected:origIdx,correct:origIdx===QUESTIONS[i].answer,t:Date.now()}; save(); render();
}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));}
init();
</script>
</body>
</html>
